name: sideworks-demo

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sideworks_demo
      MYSQL_USER: sideworks
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: localhost
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1
          -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -Nse
          "SELECT 1 FROM approval_document_typetbl WHERE type_code = 'GENERAL_PROPOSAL'" | grep -qx 1
      interval: 5s
      timeout: 3s
      retries: 24

  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://db:3306/sideworks_demo
      DB_USERNAME: sideworks
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ATTACHMENT_STORAGE_PATH: /app/attachments
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${SIDEWORKS_HTTP_PORT:-8088},http://127.0.0.1:${SIDEWORKS_HTTP_PORT:-8088}
    volumes:
      - attachments:/app/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, bash, -ec, 'true > /dev/tcp/127.0.0.1/8080']
      interval: 5s
      timeout: 3s
      retries: 24

  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:${SIDEWORKS_HTTP_PORT:-8088}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mysql-data:
  attachments:
