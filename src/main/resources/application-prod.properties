spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
jwt.access-token-validity-ms=${JWT_ACCESS_TOKEN_VALIDITY_MS:1800000}
jwt.refresh-token-validity-ms=${JWT_REFRESH_TOKEN_VALIDITY_MS:604800000}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost}
app.cookie.secure=${APP_COOKIE_SECURE:false}

server.address=127.0.0.1
server.port=8080
server.forward-headers-strategy=framework

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
