spring.application.name=sideworks
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=${ATTACHMENT_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${ATTACHMENT_MAX_REQUEST_SIZE:105MB}

app.attachment.max-file-count=${ATTACHMENT_MAX_FILE_COUNT:5}
app.attachment.max-file-size=${ATTACHMENT_MAX_FILE_SIZE:20MB}
app.attachment.max-total-size=${ATTACHMENT_MAX_TOTAL_SIZE:100MB}
app.attachment.storage-path=${ATTACHMENT_STORAGE_PATH:./sideworks-data/attachments}
app.time-zone=${APP_TIME_ZONE:Asia/Seoul}
app.attendance.check-in-deadline-enabled=${ATTENDANCE_CHECK_IN_DEADLINE_ENABLED:false}
