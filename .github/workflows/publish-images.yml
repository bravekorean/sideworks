name: Publish container images

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and publish both images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || (( ${#GITHUB_REF_NAME} > 128 )); then
            echo 'Expected a release tag such as v1.0.0 or v1.0.0-rc.1.' >&2
            exit 1
          fi

          namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          backend="$namespace-backend:$GITHUB_REF_NAME"
          frontend="$namespace-frontend:$GITHUB_REF_NAME"
          labels=(
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME"
          )
          docker build --platform linux/amd64 "${labels[@]}" --tag "$backend" .
          docker build --platform linux/amd64 "${labels[@]}" --tag "$frontend" ./frontend
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$backend"
          docker push "$frontend"
