name: Publish container images

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  validate-tag:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require main CI for a stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version='v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if (( ${#GITHUB_REF_NAME} > 128 )) || [[ ! "$GITHUB_REF_NAME" =~ ^${version}(-rc\.[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo 'Expected a release tag such as v1.0.0 or v1.0.0-rc.1.' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" =~ ^${version}-rc\. ]]; then
            exit 0
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release commit $GITHUB_SHA must be reachable from main." >&2
            exit 1
          fi

          runs=$(curl --fail --silent --show-error --retry 3 --max-time 20 --get \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            --data-urlencode 'branch=main' \
            --data-urlencode 'event=push' \
            --data-urlencode "head_sha=$GITHUB_SHA" \
            --data-urlencode 'per_page=1' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs")
          if ! jq -e --arg sha "$GITHUB_SHA" '.workflow_runs[0] | .head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success"' <<< "$runs" > /dev/null; then
            echo "Release commit $GITHUB_SHA must have a successful main push CI run." >&2
            exit 1
          fi

  publish:
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and publish both images
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          backend="$namespace-backend:$GITHUB_REF_NAME"
          frontend="$namespace-frontend:$GITHUB_REF_NAME"
          labels=(
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME"
          )
          docker build --platform linux/amd64 "${labels[@]}" --tag "$backend" .
          docker build --platform linux/amd64 "${labels[@]}" --tag "$frontend" ./frontend
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$backend"
          docker push "$frontend"
