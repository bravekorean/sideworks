name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migration immutability
    # main에 들어오기 전에 막는 검사라 PR에서만 실행한다.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block changes to migrations already on the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # 수동 적용 SQL은 이미 DB에 반영됐을 수 있으므로 기존 파일은 고치지 않고 새 파일을 추가한다.
          # 이름 변경은 삭제+추가로 보이게 해서 D로 잡는다. PR 안에서 새로 추가한 파일(A)과 README.md는 자유롭게 고칠 수 있다.
          changed="$(git diff --name-status --no-renames --diff-filter=MDT "origin/${BASE_REF}...HEAD" -- 'database/migrations/*.sql')"
          if [ -z "$changed" ]; then
            echo "기존 마이그레이션 변경 없음"
            exit 0
          fi
          while IFS=$'\t' read -r status path; do
            echo "::error file=${path}::이미 ${BASE_REF}에 있는 마이그레이션 SQL은 수정·삭제·이름 변경할 수 없습니다(${status}). 새 날짜의 파일을 추가하세요."
          done <<< "$changed"
          exit 1

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test auth session
        run: npm run test:auth

      - name: Build
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # 통합 테스트는 Testcontainers(MySQL)로 DB를 직접 띄운다. ubuntu 러너의 Docker를 그대로 쓰므로 서비스 컨테이너는 두지 않는다.
    # 벤치마크·브라우저 스모크 테스트는 SIDEWORKS_* 환경변수가 없으면 건너뛴다.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            *.gradle
            gradle/wrapper/gradle-wrapper.properties

      - name: Allow Gradle Wrapper execution
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Upload backend test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            build/test-results/test/TEST-*.xml
            build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 7
